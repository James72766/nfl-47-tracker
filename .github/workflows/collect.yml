# Takes a BetMGM snapshot, then books the next one (the relay).
# GitHub's own schedule skipped and delayed runs, so each run starts the next
# run itself behind a free GitHub wait timer (environments wait-0 ... wait-120).
# relay.py picks the timer so runs land just after each check time:
# every 2 hours at :10 UTC, 15:10 UTC, and extra Sunday-night checks.
# About 420 Odds API calls a month (free plan: 500).
name: BetMGM snapshot

on:
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait timer before this run (wait-0 ... wait-120)"
        default: "wait-0"

permissions:
  contents: write
  actions: write

concurrency: snapshot

jobs:
  wait:
    runs-on: ubuntu-latest
    environment: ${{ inputs.wait || 'wait-0' }}
    steps:
      - run: echo "Waited (${{ inputs.wait }})"

  snapshot:
    needs: wait
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save the snapshot
        run: |
          git config user.name "47-rule-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "BetMGM snapshot" || exit 0
          git pull --rebase
          git push

  next:
    # Book the next run even if this snapshot failed, but not if this run was cancelled.
    needs: snapshot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Book the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(python3 relay.py)
          echo "Next run: $wait"
          gh workflow run collect.yml -R "${{ github.repository }}" -f wait="$wait"
